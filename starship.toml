# ============================================================
# Starship Theme
# Generated from quickshell's State/colors.json
# Do not edit by hand.
#
# Source:
#   ~/.config/quickshell/State/colors.json
# ============================================================

# Don't print a new line at the start of the prompt
add_newline = false

# Pipes ╰─ ╭─
# Powerline symbols                                    
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#2f3b6a'

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[ ](bold fg:#7f8cbe)"
error_symbol = "[ ](bold fg:#ffb4ab)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#0c163b"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#0c163b)[$symbol $branch(:$remote_branch)](fg:#e2e4e9 bg:#0c163b)[ ](bold fg:#0c163b)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold #ffb4ab)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](#00e295)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:#0c163b bold fg:#e2e4e9)[](bold fg:#0c163b)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed #00e295"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#0c163b fg:#e2e4e9"
style_root = "#ffb4ab bold"
format = "[](bold fg:#0c163b)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#070f2c fg:#7f8cbe"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#070f2c)[󰉋 → $path]($style)[](bold fg:#070f2c)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#0c163b)[󰪢 $duration](bold bg:#0c163b fg:#e2e4e9)[](bold fg:#0c163b)'
